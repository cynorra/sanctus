plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'

}

android {
    namespace "com.sanctus.christian.prayer"
    compileSdk 36

    defaultConfig {
        applicationId "com.sanctus.christian.prayer"
        minSdk 24
        targetSdk 36
        versionCode 7
        versionName "1.0.6"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas"]
            }
        }

        buildConfigField "String", "WEBSITE_URL", '"https://sanctus.app"'
        buildConfigField "String", "PLAY_STORE_URL", '"https://play.google.com/store/apps/details?id=com.sanctus.christian.prayer"'
        // From Firebase Console > Authentication > Sign-in method > Google > Web SDK configuration.
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", '"99271954647-gp0ggqtig5qgn1udv8sb8fk113acqfv1.apps.googleusercontent.com"'
    }

    // Only present in CI (see .github/workflows/release-build.yml): a tag push decodes the
    // release keystore from a secret and passes its path/passwords via these env vars. A local
    // dev build has none of them set, so signingConfigs.release is simply never applied below —
    // assembleDebug/bundleDebug are completely unaffected.
    def releaseStoreFile = System.getenv("RELEASE_STORE_FILE")

    signingConfigs {
        if (releaseStoreFile != null) {
            release {
                storeFile file(releaseStoreFile)
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStoreFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    annotationProcessor 'androidx.lifecycle:lifecycle-compiler:2.7.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
    implementation 'com.google.firebase:firebase-messaging:24.0.0'

    // Accounts + invites
    implementation 'com.google.firebase:firebase-auth:23.1.0'
    implementation 'com.google.firebase:firebase-firestore:25.1.1'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.android.installreferrer:installreferrer:2.2'
}