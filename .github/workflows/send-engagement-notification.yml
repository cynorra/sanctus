name: Send daily engagement notification

on:
  schedule:
    # 08:00 UTC = 11:00 Europe/Istanbul
    - cron: '0 8 * * *'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Reuses the same service account as the content sync (roles/datastore.user is enough for
      # the Firestore read here; it also has Firebase Admin access, which covers sending FCM).
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIRESTORE_SYNC_SERVICE_ACCOUNT }}'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Send notification
        run: node scripts/send-daily-engagement-notification.js
